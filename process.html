            <p>Share your moving details via WhatsApp or call. Receive a transparent, itemized estimate within 60 minutes — no hidden charges.</p>
            <ul style="margin-top:var(--sp-md);padding-left:var(--sp-lg);color:var(--g600);line-height:2">

              <li>Itemized quote with insurance options</li>

              <li>Custom crating for fragile/valuable items</li>
              <li>Digital inventory with photos</li>
              <li>GPS-tracked truck assigned</li>
              <li>Real-time tracking via WhatsApp</li>
            </ul>
          </div>
        </li>

              <li>Furniture assembly & arrangement</li>
              <li>Unpacking & debris removal</li>
              <li>Final walkthrough with coordinator</li>
              <li>Dedicated claims support if needed</li>
            </ul>
          </div>
        </li>
